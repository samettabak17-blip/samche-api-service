name: Staging Candidate Approval Rollback Diagnostic

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: Staging tenant UUID already authorized for the diagnostic
        required: true
        type: string
      candidate_id:
        description: Existing NEEDS_REVIEW candidate UUID
        required: true
        type: string

jobs:
  diagnose:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      TENANT_ID: ${{ inputs.tenant_id }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --ignore-scripts
      - name: Run exact approval service inside a forced rollback
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import { approveConversationKnowledgeCandidate } from './services/knowledge-candidate-service.js';
          import { assertVerifiedTls, strictTlsConfig } from './scripts/staging-task6-e2e-support.js';

          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const tenantId = process.env.TENANT_ID;
          const candidateId = process.env.CANDIDATE_ID;
          if (!uuid.test(tenantId) || !uuid.test(candidateId) || !process.env.STAGING_DATABASE_URL) throw new Error('ROLLBACK_DIAGNOSTIC_CONFIGURATION_INVALID');

          const client = new pg.Client(strictTlsConfig(process.env.STAGING_DATABASE_URL));
          let ended = false;
          let diagnostic = null;
          try {
            await client.connect();
            assertVerifiedTls(client);
            const reviewer = await client.query(
              `SELECT reviewed_by FROM knowledge_candidates
                WHERE tenant_id = $1 AND reviewed_by IS NOT NULL
                ORDER BY reviewed_at DESC NULLS LAST LIMIT 1`,
              [tenantId],
            );
            if (!reviewer.rowCount || !uuid.test(reviewer.rows[0].reviewed_by)) throw new Error('ROLLBACK_DIAGNOSTIC_REVIEWER_UNAVAILABLE');
            const transactionClient = {
              query: async (sql, params = []) => {
                if (String(sql).trim() === 'COMMIT') {
                  await client.query('ROLLBACK');
                  ended = true;
                  return { rows: [] };
                }
                if (String(sql).trim() === 'ROLLBACK') ended = true;
                return client.query(sql, params);
              },
              release: () => {},
            };
            const database = { connect: async () => transactionClient };
            try {
              await approveConversationKnowledgeCandidate({
                database, tenantId, candidateId, reviewedBy: reviewer.rows[0].reviewed_by,
                approvalFailureRecorder: async (entry) => { diagnostic = entry; },
              });
              console.log(JSON.stringify({ candidate_id: candidateId, result: 'SERVICE_SUCCEEDED_ROLLED_BACK' }));
            } catch (error) {
              console.log(JSON.stringify({
                candidate_id: candidateId,
                result: 'SERVICE_FAILED_ROLLED_BACK',
                safe_code: typeof error?.code === 'string' ? error.code.replace(/[^A-Z0-9_]/g, '_').slice(0, 80) : null,
                diagnostic: diagnostic ? {
                  materialized_source_id: diagnostic.materializedSourceId ?? null,
                  original_source_id: diagnostic.originalSourceId ?? null,
                  phase: diagnostic.phase ?? null,
                  database_code: diagnostic.databaseCode ?? null,
                  constraint_name: diagnostic.constraintName ?? null,
                  table_name: diagnostic.tableName ?? null,
                } : null,
              }));
            }
          } finally {
            if (!ended) await client.query('ROLLBACK').catch(() => {});
            await client.end().catch(() => {});
          }
          NODE
