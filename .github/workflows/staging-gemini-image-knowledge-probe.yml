name: Staging Gemini Vision Image Knowledge Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run one synthetic Gemini Vision adapter probe
        env:
          GEMINI_API_KEY: ${{ secrets.STAGING_GEMINI_API_KEY }}
        run: node scripts/staging-gemini-image-knowledge-probe.js
