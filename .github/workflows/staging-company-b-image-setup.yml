name: Staging Company B Image Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Create Company B sources and reviewable image candidates
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_OWNER_TOKEN: ${{ secrets.STAGING_OWNER_TOKEN }}
          STAGING_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
        run: node scripts/staging-company-b-image-setup.js
