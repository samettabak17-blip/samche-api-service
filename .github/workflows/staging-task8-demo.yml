name: Staging Task 8 Demo & Web Chat Runtime Verification

on:
  workflow_dispatch:
    inputs:
      bootstrap_staging:
        description: 'Execute idempotent database bootstrap for Task 8 demo tenant and widget key'
        type: boolean
        default: true
        required: false
      run_ai_probes:
        description: 'Execute live AI model grounding & prompt injection probes'
        type: boolean
        default: true
        required: false
      staging_url:
        description: 'Target staging API base URL'
        type: string
        default: 'https://samche-api-staging.onrender.com'
        required: false
  push:
    branches: [staging]
    paths:
      - '.github/workflows/staging-task8-demo.yml'
      - 'public/task8-demo/**'
      - 'public/web-chat.js'
      - 'scripts/**'
      - 'services/**'
      - 'routes/**'
      - 'dashboard/**'
      - 'migrations/**'
      - 'tests/**'
      - 'app.js'

permissions:
  contents: read

jobs:
  verify_contracts:
    name: Verify Web Chat & Fixture Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run unit & contract tests
        run: >
          node --test
          tests/task8-demo-fixture.test.js
          tests/tenant-web-chat-provisioning-service.test.js
          tests/public-web-chat-integration-service.test.js
          tests/public-web-chat-runtime-integration.test.js
          tests/web-chat-page-context-runtime.test.js
          tests/url-intelligence-service.test.js
          tests/universal-public-link-intelligence.test.js
          tests/whatsapp-share-link-runtime.test.js
          tests/contextual-intelligence-service.test.js
          tests/permanence-multi-tenant-contract.test.js
          tests/proactive-visitor-intent.test.js
          tests/web-chat-natural-conversation-ux.test.js
          tests/web-chat-conversation-persistence.test.js
          tests/web-chat-channel-integration-migration.test.js
          tests/web-chat-configuration-migration.test.js
          tests/web-chat-productization.test.js
          tests/web-chat-access-model.test.js

      - name: Run Dashboard checks
        run: |
          cd dashboard
          npm install --ignore-scripts
          npx tsc -b --noEmit
          npx vitest run src/lib/permissions.test.ts src/features/channels/channels-page.test.tsx src/features/channels/web-chat-management.test.tsx
          npx vite build

  staging_bootstrap_and_verification:
    name: Staging Bootstrap and Live Runtime Verification
    needs: verify_contracts
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Bootstrap Task 8 Demo Tenant & Web Chat Widget
        if: github.event_name != 'workflow_dispatch' || inputs.bootstrap_staging != false
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          TASK8_DEMO_WIDGET_KEY: 'wch_staging_task8_demo'
        run: node scripts/bootstrap_task8_demo.js

      - name: Run Live Staging Runtime Verification
        env:
          STAGING_SERVICE_URL: ${{ inputs.staging_url || 'https://samche-api-staging.onrender.com' }}
          TASK8_DEMO_WIDGET_KEY: 'wch_staging_task8_demo'
          RUN_AI_PROBES: ${{ inputs.run_ai_probes != false }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify_staging_task8_demo.js
