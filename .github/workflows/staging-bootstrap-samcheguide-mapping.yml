name: Bootstrap Staging Samcheguide Mapping

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/staging-bootstrap-samcheguide-mapping.yml'

jobs:
  bootstrap:
    # The push trigger only registers this staging-only workflow in Actions.
    # Database work is deliberately limited to an explicit manual dispatch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SAMCHEGUIDE_TENANT_ID: ${{ secrets.STAGING_SAMCHEGUIDE_TENANT_ID }}
      SAMCHEGUIDE_ASSISTANT_ID: ${{ secrets.STAGING_SAMCHEGUIDE_ASSISTANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap explicit Samcheguide mapping
        run: node scripts/bootstrap_samcheguide_mapping.js
