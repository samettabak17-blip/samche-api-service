name: Staging Business Identity Read-Only Audit

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: Exact non-secret staging Business Identity display name
        required: true
        type: string
      source_title:
        description: Exact non-secret staging source title
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Run strict-TLS read-only identity audit
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          TASK6_AUDIT_IDENTITY_NAME: ${{ inputs.identity_name }}
          TASK6_AUDIT_SOURCE_TITLE: ${{ inputs.source_title }}
        run: node scripts/staging-business-identity-audit.js
