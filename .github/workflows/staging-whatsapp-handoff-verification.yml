name: Staging WhatsApp Handoff Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    name: Verify WhatsApp operator delivery and handoff guards
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workflow-test
          POSTGRES_PASSWORD: workflow-test
          POSTGRES_DB: workflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow-test -d workflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout selected staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install repository dependencies
        run: npm install --ignore-scripts

      - name: Validate handoff implementation syntax
        run: |
          node --check services/whatsapp-delivery-service.js
          node --check services/live-inbox-service.js
          node --check services/whatsapp-live-inbox-service.js
          node --check services/human-support-service.js
          node --check services/live-event-bus.js
          node --check app.js
          node --check services/whatsapp-tenant-context-service.js
          node --check services/conversation-communication-language.js
          node --check test/liveInboxWhatsAppOperatorDelivery.test.js
          node --check test/whatsappTenantContext.test.js
          node --check test/whatsappAuthoritativePolicy.test.js
          node --check test/whatsappGreetingOnlyPolicy.test.js
          node --check test/whatsappDeterministicSocialResponse.test.js
          node --check test/whatsappSupplementaryKnowledgeAssignment.test.js
          node --check tests/knowledge-authority-epoch.test.js
          node --check test/conversationCommunicationLanguage.test.js
          node --check services/human-support-intent.js
          node --check services/telegram-live-support-status.js
          node --check test/humanSupportIntent.test.js

      - name: Prepare isolated workflow PostgreSQL schema
        env:
          DATABASE_URL: postgresql://workflow-test:workflow-test@127.0.0.1:5432/workflow_test
          DATABASE_SSL: 'false'
          JWT_SECRET: workflow-test-only-not-for-runtime
        run: |
          npm run migrate
          npm run migrate

      - name: Run knowledge authority PostgreSQL contract
        env:
          DATABASE_URL: postgresql://workflow-test:workflow-test@127.0.0.1:5432/workflow_test
          DATABASE_SSL: 'false'
          JWT_SECRET: workflow-test-only-not-for-runtime
        run: node --test tests/knowledge-authority-epoch.test.js

      - name: Run WhatsApp operator delivery and handoff regressions
        env:
          DATABASE_URL: postgresql://workflow-test:workflow-test@127.0.0.1:5432/workflow_test
          DATABASE_SSL: 'false'
          JWT_SECRET: workflow-test-only-not-for-runtime
        run: >-
          node --test
          test/liveInboxWhatsAppOperatorDelivery.test.js
          test/whatsappAssistantTimelinePersistence.test.js
          test/whatsappTenantContext.test.js
          test/whatsappAuthoritativePolicy.test.js
          test/whatsappGreetingOnlyPolicy.test.js
          test/whatsappDeterministicSocialResponse.test.js
          test/whatsappDeterministicTemplateParity.test.js
          test/whatsappSupplementaryKnowledgeAssignment.test.js
          test/conversationCommunicationLanguage.test.js
          test/humanSupportService.test.js
          test/humanSupportAcknowledgementAuditSchema.test.js
          test/humanSupportIntent.test.js
          test/whatsappSequentialResourceContext.test.js
          test/whatsappResourceFollowUpRouting.test.js
          test/whatsappResourceRetry.test.js
          test/whatsappStandaloneMediaAcknowledgement.test.js
