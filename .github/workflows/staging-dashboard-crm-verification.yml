name: Staging Dashboard CRM Verification

on:
  workflow_dispatch:

jobs:
  dashboard-crm-verification:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected staging revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Install dashboard dependencies
        run: npm --prefix dashboard install --no-audit --no-fund

      - name: Show dashboard toolchain resolution
        run: npm --prefix dashboard ls vite vitest @vitejs/plugin-react typescript --depth=2

      - name: Validate Task 3 paths and package scripts
        run: |
          test -f package.json
          test -f dashboard/package.json
          test -f services/crm-lead-detail-service.js
          test -f services/crm-read-service.js
          test -f services/crm-deal-service.js
          test -f migrations/005_crm_deals_pipeline_metrics.sql
          test -f routes/crmRoutes.js
          test -f dashboard/src/features/leads/leads-page.tsx
          test -f dashboard/src/features/leads/leads-page.test.tsx
          test -f dashboard/src/features/pipeline/pipeline-page.tsx
          test -f dashboard/src/features/pipeline/pipeline-page.test.tsx
          test -f dashboard/vitest.config.ts
          test -f tests/crm-lead-detail-service.test.js
          test -f tests/crm-read-provider-boundary.test.js
          test -f tests/crm-deal-service.test.js
          test -f tests/crm-deal-read-service.test.js
          test -f tests/crm-deals-migration.test.js
          test -f tests/lead-qualification-service.test.js
          grep -Fq '"test": "vitest run --environment jsdom"' dashboard/package.json
          grep -Fq '"build": "tsc -b && vite build"' dashboard/package.json

      - name: Dashboard Vitest suite
        run: npm --prefix dashboard test

      - name: Dashboard TypeScript project check
        run: cd dashboard && ./node_modules/.bin/tsc -b --pretty false

      - name: Dashboard Vite production build
        run: npm --prefix dashboard run build

      - name: Backend CRM regression suite
        run: |
          node --test             tests/crm-lead-detail-service.test.js             tests/crm-read-provider-boundary.test.js             tests/crm-deal-service.test.js             tests/crm-deal-read-service.test.js             tests/crm-deals-migration.test.js             tests/crm-migration.test.js             tests/lead-qualification-service.test.js             tests/crm-lead-service.test.js             tests/crm-permissions.test.js             tests/conversation-permissions.test.js
