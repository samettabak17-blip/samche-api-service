name: Staging PDF Extraction Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe pdf-parse on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout selected staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install repository dependencies
        run: npm install --ignore-scripts

      - name: Validate probe syntax
        run: |
          node --check services/conversation-document-extraction-service.js
          node --check scripts/staging_pdf_extraction_probe.js

      - name: Run focused extraction and WhatsApp resource regressions
        run: >
          node --test
          test/conversationDocumentExtractionService.test.js
          test/conversationDocumentExtractionDiagnostic.test.js
          test/whatsappSequentialResourceContext.test.js
          test/whatsappResourceFollowUpRouting.test.js
          test/whatsappResourceRetry.test.js
          test/whatsappStandaloneMediaAcknowledgement.test.js

      - name: Run PDF extraction probe
        run: node scripts/staging_pdf_extraction_probe.js
