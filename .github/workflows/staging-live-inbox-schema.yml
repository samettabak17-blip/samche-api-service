name: Staging Live Inbox Schema Checks

on:
  push:
    branches: [staging]
    paths:
      - 'app.js'
      - 'routes/conversationRoutes.js'
      - 'services/**'
      - 'test/**'
      - 'tests/**'
      - 'routes/**'
      - 'migrations/003_live_inbox_handoff.sql'
      - 'tests/conversation-permissions.test.js'
      - 'tests/samcheguide-runtime.test.js'
      - 'services/samcheguide-runtime.js'
      - 'scripts/acceptance_live_inbox.js'
      - 'scripts/cleanup_live_inbox_fixture.js'
      - 'dashboard/**'
      - '.github/workflows/staging-live-inbox-schema.yml'
      - '.github/workflows/staging-bootstrap-samcheguide-mapping.yml'
      - 'scripts/bootstrap_samcheguide_mapping.js'
  workflow_dispatch:

jobs:
  verify:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      JWT_SECRET: ci-live-inbox-test-secret
    steps:
      - uses: actions/checkout@v4
      - name: Install backend dependencies
        run: npm install
      - name: Verify operator permission rules
        run: node --test tests/conversation-permissions.test.js tests/samcheguide-runtime.test.js test/dashboardAnalyticsService.test.js test/conversationRoutesProjection.test.js test/whatsappAgentMediaDelivery.test.js test/liveInboxWhatsAppOperatorMedia.test.js test/whatsappAssistantTimelinePersistence.test.js test/whatsappDeliveryStatus.test.js test/conversationResourceAudioValidation.test.js test/whatsappMultimodalService.test.js
      - name: Verify live inbox syntax
        run: |
          node --check app.js
          node --check routes/conversationRoutes.js
          node --check services/live-inbox-service.js
          node --check services/whatsapp-delivery-service.js
          node --check services/whatsapp-live-inbox-service.js
          node --check services/conversation-resource-validation.js
          node --check services/live-event-bus.js
          node --check services/dashboard-analytics-service.js
          node --check scripts/verify_dashboard_analytics.js
          node --check scripts/acceptance_live_inbox.js
          node --check scripts/cleanup_live_inbox_fixture.js
          node --check scripts/bootstrap_samcheguide_mapping.js
      - name: Verify dashboard tests and production build
        run: |
          npm --prefix dashboard install
          npm --prefix dashboard test
          npm --prefix dashboard run build
      - name: Verify live inbox schema
        run: |
          npm install --no-save pg@8.16.3
          node <<'NODE'
          const { Pool } = require('pg');
          (async () => {
            const pool = new Pool({
              connectionString: process.env.STAGING_DATABASE_URL,
              ssl: { rejectUnauthorized: false },
            });
            try {
              const result = await pool.query(
                `SELECT
                    to_regclass('public.channel_integrations') IS NOT NULL AS has_mapping_table,
                    to_regclass('public.conversation_audit_events') IS NOT NULL AS has_audit_table,
                    EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'conversations'
                        AND column_name = 'handling_mode'
                    ) AS has_handling_mode,
                    EXISTS (
                      SELECT 1
                      FROM pg_constraint
                      WHERE conrelid = 'public.conversation_audit_events'::regclass
                        AND contype = 'c'
                        AND pg_get_constraintdef(oid) LIKE '%HUMAN_SUPPORT_ACKNOWLEDGED%'
                    ) AS has_agent_ack_audit_event,
                    EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'conversation_messages'
                        AND column_name = 'delivery_status'
                        AND data_type = 'character varying'
                        AND character_maximum_length = 20
                        AND is_nullable = 'YES'
                    ) AS has_typed_delivery_status,
                    EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'conversation_messages'
                        AND column_name = 'delivery_status_updated_at'
                        AND data_type = 'timestamp with time zone'
                        AND is_nullable = 'YES'
                    ) AS has_typed_delivery_status_timestamp,
                    EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'conversation_messages'
                        AND column_name = 'delivery_failure_code'
                        AND data_type = 'character varying'
                        AND character_maximum_length = 80
                        AND is_nullable = 'YES'
                    ) AS has_typed_delivery_failure_code,
                    EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'conversation_messages'
                        AND column_name = 'tenant_id'
                        AND data_type = 'uuid'
                        AND is_nullable = 'NO'
                    )
                    AND EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'conversation_messages'
                        AND column_name = 'conversation_id'
                        AND data_type = 'uuid'
                        AND is_nullable = 'NO'
                    )
                    AND EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'conversations'
                        AND column_name = 'id'
                        AND data_type = 'uuid'
                        AND is_nullable = 'NO'
                    )
                    AND EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'conversations'
                        AND column_name = 'tenant_id'
                        AND data_type = 'uuid'
                        AND is_nullable = 'NO'
                    ) AS has_typed_delivery_scope_ids,
                    EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'conversation_messages'
                        AND column_name = 'external_message_id'
                        AND data_type = 'character varying'
                        AND character_maximum_length = 255
                    ) AS has_typed_provider_message_id,
                    EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'tenant_channels'
                        AND column_name = 'external_channel_id'
                        AND data_type = 'character varying'
                        AND character_maximum_length = 255
                    ) AS has_typed_provider_channel_id,
                    EXISTS (
                      SELECT 1
                      FROM pg_constraint
                      WHERE conrelid = 'public.conversation_messages'::regclass
                        AND contype = 'c'
                        AND pg_get_constraintdef(oid) LIKE '%delivery_status%'
                    ) AS has_delivery_status_constraint`
              );
              const row = result.rows[0];
              if (!row.has_mapping_table || !row.has_audit_table || !row.has_handling_mode || !row.has_agent_ack_audit_event
                || !row.has_typed_delivery_status || !row.has_typed_delivery_status_timestamp || !row.has_typed_delivery_failure_code
                || !row.has_typed_delivery_scope_ids || !row.has_typed_provider_message_id || !row.has_typed_provider_channel_id || !row.has_delivery_status_constraint) {
                throw new Error('Live inbox migration or WhatsApp delivery-status schema contract is not applied');
              }
              console.log('PASS | STAGING | live inbox schema and WhatsApp delivery-status type contract');
              await import('./scripts/verify_dashboard_analytics.js');
            } finally {
              await pool.end();
            }
          })().catch((error) => {
            console.error('FAIL | STAGING | live inbox schema migration');
            process.exitCode = 1;
          });
          NODE
