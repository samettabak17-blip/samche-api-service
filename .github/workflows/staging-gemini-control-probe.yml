name: Staging Gemini Control Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run one-shot Gemini control request
        env:
          STAGING_GEMINI_API_KEY: ${{ secrets.STAGING_GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const started = Date.now();
          const key = process.env.STAGING_GEMINI_API_KEY;
          if (!key) {
            console.log(JSON.stringify({ request_count: 0, http_status: null, response_received: false, expected_ok: false, elapsed_ms: 0, classification: 'SECRET_NOT_AVAILABLE' }));
            process.exit(0);
          }
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 30000);
          try {
            const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
              signal: controller.signal,
              body: JSON.stringify({
                contents: [{ role: 'user', parts: [{ text: 'Return exactly OK' }] }],
                generationConfig: { temperature: 0, thinkingConfig: { thinkingLevel: 'low' } },
              }),
            });
            const body = await response.json().catch(() => null);
            const text = body?.candidates?.[0]?.content?.parts?.map((part) => part?.text || '').join('').trim() || '';
            console.log(JSON.stringify({ request_count: 1, http_status: response.status, response_received: true, expected_ok: text === 'OK', elapsed_ms: Date.now() - started, classification: response.ok && text === 'OK' ? 'SUCCESS' : 'HTTP_ERROR' }));
          } catch (error) {
            console.log(JSON.stringify({ request_count: 1, http_status: null, response_received: false, expected_ok: false, elapsed_ms: Date.now() - started, classification: controller.signal.aborted ? 'ABORT_TIMEOUT' : 'NETWORK_ERROR' }));
          } finally {
            clearTimeout(timer);
          }
          NODE
