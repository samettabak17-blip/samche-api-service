name: Staging dashboard integration
on:
  workflow_dispatch:
jobs:
  integration:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      API: https://samche-api-staging.onrender.com
      STAGING_OWNER_TOKEN: ${{ secrets.STAGING_OWNER_TOKEN }}
      STAGING_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
    steps:
      - name: Authenticated dashboard matrix
        shell: bash
        run: |
          node <<'NODE'
          const api = process.env.API;
          const ownerToken = process.env.STAGING_OWNER_TOKEN;
          const adminToken = process.env.STAGING_ADMIN_TOKEN;
          let failures = 0;
          const cleanup = [];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const summary = (value) => String(value || '').replace(/[\r\n]+/g, ' ').slice(0, 240);

          function log(status, role, method, endpoint, detail) {
            console.log([status, role, method, endpoint, detail].filter(Boolean).join(' | '));
          }

          async function request(role, method, endpoint, token, expected, body) {
            log('START', role, method, endpoint);
            for (let attempt = 1; attempt <= 4; attempt += 1) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 20000);
              let response;
              let text = '';
              try {
                response = await fetch(api + endpoint, {
                  method,
                  headers: {
                    ...(token ? { Authorization: 'Bearer ' + token } : {}),
                    ...(body === undefined ? {} : { 'Content-Type': 'application/json' })
                  },
                  ...(body === undefined ? {} : { body: JSON.stringify(body) }),
                  signal: controller.signal
                });
                text = await response.text();
              } catch (error) {
                clearTimeout(timeout);
                if (error.name === 'AbortError') {
                  failures += 1;
                  log('FAIL', role, method, endpoint, 'TIMEOUT');
                  return { status: 0, text: '', json: null, ok: false };
                }
                failures += 1;
                log('FAIL', role, method, endpoint, 'NETWORK ' + summary(error.message));
                return { status: 0, text: '', json: null, ok: false };
              }
              clearTimeout(timeout);

              if ([502, 503, 504].includes(response.status)) {
                log('TRANSIENT_RENDER_GATEWAY', role, method, endpoint, 'HTTP ' + response.status + ' attempt ' + attempt);
                await sleep(1000 * (2 ** attempt));
                continue;
              }

              let json = null;
              try { json = text ? JSON.parse(text) : null; } catch {}
              const accepted = Array.isArray(expected) ? expected : [expected];
              const ok = accepted.includes(response.status);
              if (ok) log('PASS', role, method, endpoint, 'HTTP ' + response.status);
              else {
                failures += 1;
                log('FAIL', role, method, endpoint, 'expected ' + accepted.join('/') + ' got ' + response.status + ' ' + summary(text));
              }
              return { status: response.status, text, json, ok };
            }
            failures += 1;
            log('FAIL', role, method, endpoint, 'TRANSIENT_RENDER_GATEWAY retries exhausted');
            return { status: 0, text: '', json: null, ok: false };
          }

          function requireId(result, path) {
            const parts = path.split('.');
            let value = result.json;
            for (const part of parts) value = value && value[part];
            if (!value) throw new Error('Fixture response missing ' + path);
            return value;
          }

          async function setup() {
            const adminMe = await request('ADMIN', 'GET', '/api/v1/auth/me', adminToken, 200);
            const adminId = requireId(adminMe, 'user.id');
            const stamp = Date.now().toString(36);
            const tenantA = await request('OWNER', 'POST', '/api/v1/tenants', ownerToken, 201, { name: '__ci_dashboard_a_' + stamp });
            const tenantB = await request('OWNER', 'POST', '/api/v1/tenants', ownerToken, 201, { name: '__ci_dashboard_b_' + stamp });
            const tenantAId = requireId(tenantA, 'id');
            const tenantBId = requireId(tenantB, 'id');

            const register = await request('PUBLIC', 'POST', '/api/v1/auth/register', '', 201, {
              email: 'ci-agent-' + stamp + '@example.test',
              password: 'CiAgent-' + stamp + '-A9'
            });
            const agentId = requireId(register, 'user.id');
            const login = await request('PUBLIC', 'POST', '/api/v1/auth/login', '', 200, {
              email: 'ci-agent-' + stamp + '@example.test',
              password: 'CiAgent-' + stamp + '-A9'
            });
            const agentToken = requireId(login, 'token');

            await request('OWNER', 'POST', '/api/v1/tenants/' + tenantAId + '/users', ownerToken, 201, { user_id: adminId, tenant_role: 'ADMIN' });
            await request('OWNER', 'POST', '/api/v1/tenants/' + tenantBId + '/users', ownerToken, 201, { user_id: agentId, tenant_role: 'AGENT' });

            cleanup.push(async () => request('OWNER', 'DELETE', '/api/v1/tenants/' + tenantAId + '/users/' + adminId, ownerToken, [200, 404]));
            cleanup.push(async () => request('OWNER', 'DELETE', '/api/v1/tenants/' + tenantBId + '/users/' + agentId, ownerToken, [200, 404]));
            return { tenantAId, tenantBId, adminId, agentId, agentToken };
          }

          async function run() {
            for (let i = 0; i < 8; i += 1) {
              const health = await request('PUBLIC', 'GET', '/api/v1/health', '', 200);
              if (health.ok) break;
              if (i === 7) throw new Error('Staging health readiness failed');
              await sleep(1000 * (2 ** i));
            }
            await request('PUBLIC', 'GET', '/api/v1/health/db', '', 200);
            await request('OWNER', 'GET', '/api/v1/tenants', ownerToken, 200);

            const fx = await setup();
            const a = '/api/v1/tenants/' + fx.tenantAId;
            const b = '/api/v1/tenants/' + fx.tenantBId;

            await request('ADMIN', 'GET', a, adminToken, 200);
            await request('AGENT', 'GET', b, fx.agentToken, 200);
            await request('ADMIN', 'GET', b, adminToken, 403);
            await request('AGENT', 'GET', a, fx.agentToken, 403);

            const assistantA = await request('ADMIN', 'POST', a + '/assistants', adminToken, 201, { name: 'CI assistant A', system_prompt: 'test', model: 'gpt-4o-mini' });
            const assistantAId = requireId(assistantA, 'id');
            cleanup.push(async () => request('OWNER', 'DELETE', a + '/assistants/' + assistantAId, ownerToken, [200, 404]));
            const assistantB = await request('OWNER', 'POST', b + '/assistants', ownerToken, 201, { name: 'CI assistant B', system_prompt: 'test', model: 'gpt-4o-mini' });
            const assistantBId = requireId(assistantB, 'id');
            cleanup.push(async () => request('OWNER', 'DELETE', b + '/assistants/' + assistantBId, ownerToken, [200, 404]));

            const ownerChannel = await request('OWNER', 'POST', a + '/channels', ownerToken, 201, { channel_type: 'WEB_CHAT', display_name: 'CI owner channel', assistant_id: assistantAId });
            const ownerChannelId = requireId(ownerChannel, 'id');
            await request('OWNER', 'GET', a + '/channels/' + ownerChannelId, ownerToken, 200);
            await request('OWNER', 'PUT', a + '/channels/' + ownerChannelId, ownerToken, 200, { channel_type: 'WEB_CHAT', display_name: 'CI owner channel updated', assistant_id: assistantAId });
            await request('OWNER', 'DELETE', a + '/channels/' + ownerChannelId, ownerToken, 200);

            const adminChannel = await request('ADMIN', 'POST', a + '/channels', adminToken, 201, { channel_type: 'WEB_CHAT', display_name: 'CI admin channel', assistant_id: assistantAId });
            const adminChannelId = requireId(adminChannel, 'id');
            cleanup.push(async () => request('OWNER', 'DELETE', a + '/channels/' + adminChannelId, ownerToken, [200, 404]));
            await request('ADMIN', 'GET', a + '/channels', adminToken, 200);
            await request('ADMIN', 'GET', a + '/channels/' + adminChannelId, adminToken, 200);
            await request('ADMIN', 'PUT', a + '/channels/' + adminChannelId, adminToken, 200, { channel_type: 'WEB_CHAT', display_name: 'CI admin channel updated', assistant_id: assistantAId });

            const agentChannel = await request('OWNER', 'POST', b + '/channels', ownerToken, 201, { channel_type: 'WEB_CHAT', display_name: 'CI agent channel', assistant_id: assistantBId });
            const agentChannelId = requireId(agentChannel, 'id');
            cleanup.push(async () => request('OWNER', 'DELETE', b + '/channels/' + agentChannelId, ownerToken, [200, 404]));
            await request('AGENT', 'GET', b + '/channels', fx.agentToken, 200);
            await request('AGENT', 'GET', b + '/channels/' + agentChannelId, fx.agentToken, 200);
            await request('AGENT', 'POST', b + '/channels', fx.agentToken, 403, { channel_type: 'WEB_CHAT', display_name: 'blocked' });
            await request('AGENT', 'PUT', b + '/channels/' + agentChannelId, fx.agentToken, 403, { channel_type: 'WEB_CHAT', display_name: 'blocked' });
            await request('AGENT', 'DELETE', b + '/channels/' + agentChannelId, fx.agentToken, 403);
            await request('ADMIN', 'GET', a + '/channels/' + agentChannelId, adminToken, 404);
            await request('AGENT', 'GET', b + '/channels/' + adminChannelId, fx.agentToken, 404);
            await request('ADMIN', 'GET', a + '/channels/not-a-uuid', adminToken, 400);
            await request('ADMIN', 'POST', a + '/channels', adminToken, 400, { channel_type: 'BAD', display_name: '' });
            await request('ADMIN', 'POST', a + '/channels', adminToken, 400, { channel_type: 'WEB_CHAT', display_name: 'wrong assistant', assistant_id: assistantBId });

            const adminDoc = await request('ADMIN', 'POST', a + '/knowledge-base', adminToken, 201, { title: 'CI document', content: 'fixture', assistant_id: assistantAId });
            const adminDocId = requireId(adminDoc, 'id');
            cleanup.push(async () => request('OWNER', 'DELETE', a + '/knowledge-base/' + adminDocId, ownerToken, [200, 404]));
            await request('ADMIN', 'GET', a + '/knowledge-base', adminToken, 200);
            await request('ADMIN', 'GET', a + '/knowledge-base/' + adminDocId, adminToken, 200);
            await request('ADMIN', 'PUT', a + '/knowledge-base/' + adminDocId, adminToken, 200, { title: 'CI document updated', content: 'fixture', assistant_id: assistantAId });

            const agentDoc = await request('OWNER', 'POST', b + '/knowledge-base', ownerToken, 201, { title: 'CI agent document', content: 'fixture', assistant_id: assistantBId });
            const agentDocId = requireId(agentDoc, 'id');
            cleanup.push(async () => request('OWNER', 'DELETE', b + '/knowledge-base/' + agentDocId, ownerToken, [200, 404]));
            await request('AGENT', 'GET', b + '/knowledge-base', fx.agentToken, 200);
            await request('AGENT', 'GET', b + '/knowledge-base/' + agentDocId, fx.agentToken, 200);
            await request('AGENT', 'POST', b + '/knowledge-base', fx.agentToken, 403, { title: 'blocked', content: 'blocked' });
            await request('AGENT', 'PUT', b + '/knowledge-base/' + agentDocId, fx.agentToken, 403, { title: 'blocked', content: 'blocked' });
            await request('AGENT', 'DELETE', b + '/knowledge-base/' + agentDocId, fx.agentToken, 403);
            await request('ADMIN', 'GET', a + '/knowledge-base/' + agentDocId, adminToken, 404);
            await request('ADMIN', 'POST', a + '/knowledge-base', adminToken, 400, { title: '', content: '' });
            await request('ADMIN', 'POST', a + '/knowledge-base', adminToken, 400, { title: 'wrong assistant', content: 'fixture', assistant_id: assistantBId });
            await request('ADMIN', 'DELETE', a + '/knowledge-base/' + adminDocId, adminToken, 200);

            await request('ADMIN', 'GET', a + '/conversations?limit=1&offset=0', adminToken, 200);
            await request('AGENT', 'GET', b + '/conversations?limit=1&offset=0', fx.agentToken, 200);
            await request('ADMIN', 'GET', a + '/team', adminToken, 200);
            await request('AGENT', 'GET', b + '/team', fx.agentToken, 200);

            log('BLOCKED', 'PUBLIC', 'GET', a + '/conversations/:conversationId/messages', 'No conversation/message creation or fixture access exists in the API');
            log('BLOCKED', 'OWNER', 'DELETE', a + '/channels/:channelId', 'RESTRICT needs a persisted conversation; no API fixture path exists');
            failures += 1;

            const assistantCrud = await request('ADMIN', 'POST', a + '/assistants', adminToken, 201, { name: 'CI assistant CRUD', system_prompt: 'test', model: 'gpt-4o-mini' });
            const assistantCrudId = requireId(assistantCrud, 'id');
            await request('ADMIN', 'GET', a + '/assistants/' + assistantCrudId, adminToken, 200);
            await request('ADMIN', 'PUT', a + '/assistants/' + assistantCrudId, adminToken, 200, { name: 'CI assistant CRUD updated' });
            await request('ADMIN', 'DELETE', a + '/assistants/' + assistantCrudId, adminToken, 200);

            await request('ADMIN', 'DELETE', a + '/channels/' + adminChannelId, adminToken, 200);

            await request('PUBLIC', 'POST', '/api/chat', '', 400, { message: '' });
            await request('PUBLIC', 'POST', '/chat', '', 200, { text: 'merhaba' });
            await request('PUBLIC', 'POST', '/plan', '', 400, { sector: '' });
            await request('PUBLIC', 'POST', '/webhook', '', 401);
          }

          (async () => {
            try {
              await run();
            } catch (error) {
              failures += 1;
              console.log('FAIL | HARNESS | RUN | setup | ' + summary(error.message));
            } finally {
              for (const action of cleanup.reverse()) {
                try { await action(); } catch (error) {
                  failures += 1;
                  console.log('FAIL | CLEANUP | DELETE | fixture | ' + summary(error.message));
                }
              }
              console.log('CLEANUP | INFO | DELETE | tenant/user | Existing API has no DELETE tenant or DELETE user endpoint; those fixture records remain');
            }
            process.exit(failures === 0 ? 0 : 1);
          })();
          NODE
