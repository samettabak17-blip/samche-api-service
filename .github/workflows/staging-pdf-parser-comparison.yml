name: Staging PDF Parser Comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Baseline pdf-parse 1.1.4
        run: node scripts/staging_pdf_extraction_probe.js
      - name: Install diagnostic pdf-parse v2 candidate
        run: npm install --no-save --ignore-scripts pdf-parse@2.4.5
      - name: Run maintained parser candidate
        run: node scripts/staging_pdf_parse_v2_probe.js
