name: Knowledge Base V2 staging preflight
on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/staging-kb-v2-preflight.yml
      - migrations/016_knowledge_intelligence.sql
      - migrations/017_knowledge_source_archival.sql
      - migrations/018_knowledge_source_processing.sql
      - migrations/019_knowledge_configuration_activation.sql
      - migrations/020_knowledge_gap_deduplication.sql
      - migrations/021_knowledge_gap_signals.sql
      - migrations/022_knowledge_generation_provenance.sql
      - routes/knowledge-*.js
      - services/knowledge-*.js
      - tests/knowledge-*.test.js
      - dashboard/src/features/knowledge-intelligence/**
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install API dependencies
        run: npm install --ignore-scripts
      - name: Run Task 6 focused contract tests
        run: node --test tests/knowledge-*.test.js

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install database client
        run: npm install --no-save pg@8.16.3
      - name: Inspect Task 6 staging schema without exposing credentials
        shell: bash
        run: |
          node <<'NODE'
          const { Pool } = require('pg');

          (async () => {
            const pool = new Pool({
              connectionString: process.env.STAGING_DATABASE_URL,
              ssl: { rejectUnauthorized: false },
            });
            try {
              const result = await pool.query(`
                SELECT
                  current_setting('server_version') AS server_version,
                  EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector') AS vector_installed,
                  EXISTS (SELECT 1 FROM pg_available_extensions WHERE name = 'vector') AS vector_available,
                  has_database_privilege(current_database(), 'CREATE') AS can_create_in_database
              `);
              const row = result.rows[0];
              console.log('POSTGRES_VERSION: ' + row.server_version);
              console.log('PGVECTOR_INSTALLED: ' + (row.vector_installed ? 'yes' : 'no'));
              console.log('PGVECTOR_AVAILABLE: ' + (row.vector_available ? 'yes' : 'no'));
              console.log('DATABASE_CREATE_PRIVILEGE: ' + (row.can_create_in_database ? 'yes' : 'no'));
              if (!row.vector_installed || !row.vector_available) {
                console.log('KBV2_PREFLIGHT: BLOCKED_PGVECTOR_UNAVAILABLE');
                process.exitCode = 2;
                return;
              }

              const expectedTables = [
                'knowledge_source_assistants', 'knowledge_chunks', 'knowledge_candidates',
                'knowledge_candidate_evidence', 'knowledge_gaps', 'knowledge_processing_jobs',
                'knowledge_gap_signals', 'business_profiles', 'business_profile_versions',
                'assistant_knowledge_recommendations', 'assistant_configuration_versions',
                'knowledge_generation_runs'
              ];
              const expectedColumns = {
                knowledge_base_documents: ['source_type', 'storage_key', 'processing_status', 'indexing_status', 'extraction_hash', 'extraction_method', 'extracted_at'],
                knowledge_gaps: ['dedupe_key', 'signal_type', 'last_detected_at'],
                business_profiles: ['approved_version_id', 'active_version_id', 'activated_by', 'activated_at'],
                business_profile_versions: ['generation_run_id', 'activated_by', 'activated_at', 'superseded_by_version_id'],
                assistant_knowledge_recommendations: ['generation_run_id'],
                assistant_configuration_versions: ['generation_run_id', 'status', 'approved_at', 'activated_at', 'supersedes_version_id'],
                ai_assistants: ['active_configuration_version_id']
              };
              const expectedIndexes = [
                'knowledge_chunks_embedding_hnsw', 'idx_knowledge_processing_jobs_claim',
                'uq_knowledge_gaps_tenant_dedupe', 'idx_knowledge_gaps_tenant_assistant_review',
                'idx_knowledge_gap_signals_tenant_assistant',
                'idx_assistant_configuration_versions_one_active',
                'idx_knowledge_generation_runs_tenant_created'
              ];
              const expectedConstraints = [
                'fk_business_profiles_active_version', 'fk_business_profile_versions_superseded_by',
                'fk_assistant_configuration_versions_supersedes',
                'fk_ai_assistants_active_configuration_version',
                'fk_business_profile_versions_generation_run',
                'fk_assistant_recommendations_generation_run',
                'fk_assistant_configurations_generation_run'
              ];

              const tables = await pool.query(
                `SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name = ANY($1::text[])`,
                [expectedTables]
              );
              const presentTables = new Set(tables.rows.map(({ table_name }) => table_name));
              const missingTables = expectedTables.filter((name) => !presentTables.has(name));

              const missingColumns = [];
              for (const [table, columns] of Object.entries(expectedColumns)) {
                const found = await pool.query(
                  `SELECT column_name FROM information_schema.columns WHERE table_schema = 'public' AND table_name = $1 AND column_name = ANY($2::text[])`,
                  [table, columns]
                );
                const present = new Set(found.rows.map(({ column_name }) => column_name));
                for (const column of columns) if (!present.has(column)) missingColumns.push(table + '.' + column);
              }

              const indexes = await pool.query(
                `SELECT indexname FROM pg_indexes WHERE schemaname = 'public' AND indexname = ANY($1::text[])`,
                [expectedIndexes]
              );
              const presentIndexes = new Set(indexes.rows.map(({ indexname }) => indexname));
              const missingIndexes = expectedIndexes.filter((name) => !presentIndexes.has(name));

              const constraints = await pool.query(
                `SELECT conname FROM pg_constraint WHERE conname = ANY($1::text[])`,
                [expectedConstraints]
              );
              const presentConstraints = new Set(constraints.rows.map(({ conname }) => conname));
              const missingConstraints = expectedConstraints.filter((name) => !presentConstraints.has(name));

              console.log('TASK6_TABLES: ' + (missingTables.length ? 'missing ' + missingTables.join(',') : 'ok'));
              console.log('TASK6_COLUMNS: ' + (missingColumns.length ? 'missing ' + missingColumns.join(',') : 'ok'));
              console.log('TASK6_INDEXES: ' + (missingIndexes.length ? 'missing ' + missingIndexes.join(',') : 'ok'));
              console.log('TASK6_CONSTRAINTS: ' + (missingConstraints.length ? 'missing ' + missingConstraints.join(',') : 'ok'));
              if (missingTables.length || missingColumns.length || missingIndexes.length || missingConstraints.length) {
                console.log('KBV2_PREFLIGHT: BLOCKED_SCHEMA_INCOMPLETE');
                process.exitCode = 3;
                return;
              }

              const mappings = await pool.query(`
                SELECT
                  ci.tenant_id,
                  ci.assistant_id,
                  aa.name AS assistant_name,
                  array_agg(DISTINCT connected.channel_type ORDER BY connected.channel_type)
                    FILTER (WHERE connected.status = 'active') AS connected_channels
                FROM channel_integrations ci
                JOIN ai_assistants aa
                  ON aa.id = ci.assistant_id AND aa.tenant_id = ci.tenant_id
                JOIN tenant_channels mapped
                  ON mapped.id = ci.channel_id
                  AND mapped.tenant_id = ci.tenant_id
                  AND mapped.assistant_id = ci.assistant_id
                LEFT JOIN tenant_channels connected
                  ON connected.tenant_id = ci.tenant_id
                  AND connected.assistant_id = ci.assistant_id
                WHERE ci.enabled = true
                  AND ci.integration_type IN ('WHATSAPP', 'SAMCHEGUIDE')
                GROUP BY ci.tenant_id, ci.assistant_id, aa.name
                ORDER BY ci.tenant_id, ci.assistant_id
              `);
              for (const mapping of mappings.rows) {
                console.log('CHANNEL_ASSISTANT_MAPPING: ' + JSON.stringify(mapping));
              }
              console.log('CHANNEL_ASSISTANT_MAPPING_COUNT: ' + mappings.rowCount);
              console.log('KBV2_PREFLIGHT: TASK6_SCHEMA_COMPATIBLE');
            } finally {
              await pool.end();
            }
          })().catch((error) => {
            console.error('KBV2_PREFLIGHT: DATABASE_CHECK_FAILED');
            process.exitCode = 1;
          });
          NODE
