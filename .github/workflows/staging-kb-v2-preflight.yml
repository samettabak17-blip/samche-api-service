name: Knowledge Base V2 staging preflight
on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/staging-kb-v2-preflight.yml
      - migrations/016_knowledge_intelligence.sql
      - migrations/017_knowledge_source_archival.sql
      - migrations/018_knowledge_source_processing.sql
      - migrations/019_knowledge_configuration_activation.sql
      - migrations/020_knowledge_gap_deduplication.sql
      - migrations/021_knowledge_gap_signals.sql
      - migrations/022_knowledge_generation_provenance.sql
      - migrations/023_web_chat_channel_integration.sql
      - migrations/024_knowledge_authority_epoch.sql
      - migrations/026_tenant_persona_v2.sql
      - routes/knowledge-*.js
      - services/knowledge-*.js
      - services/channel-knowledge-authority-memory.js
      - services/tenant-runtime-persona-service.js
      - services/dashboard-analytics-service.js
      - migrations/030_dashboard_analytics_indexes.sql
      - tests/dashboard-analytics-service.test.js
      - test/dashboardAnalyticsPostgres.test.js
      - services/tenant-follow-up-service.js
      - test/knowledgeAuthorityService.test.js
      - test/channelKnowledgeAuthorityMemory.test.js
      - tests/knowledge-*.test.js
      - dashboard/src/features/knowledge-intelligence/**
  workflow_dispatch:
    inputs:
      auth_role_audit:
        description: Run only the strict-TLS staging authentication role audit
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  focused-tests:
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || inputs.auth_role_audit != true)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install API dependencies
        run: npm install --ignore-scripts
      - name: Run Task 6 focused contract tests
        run: >-
          node --test
          tests/knowledge-*.test.js
          test/knowledgeAuthorityService.test.js
          test/channelKnowledgeAuthorityMemory.test.js
          test/whatsappTenantPersonaIsolation.test.js
          test/tenantFollowUpService.test.js
          tests/tenant-runtime-persona-service.test.js
          tests/knowledge-runtime-samcheguide-integration.test.js

  dashboard-analytics-postgres:
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || inputs.auth_role_audit != true)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workflow-test
          POSTGRES_PASSWORD: workflow-test
          POSTGRES_DB: workflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow-test -d workflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://workflow-test:workflow-test@127.0.0.1:5432/workflow_test
      DATABASE_SSL: 'false'
      JWT_SECRET: workflow-test-only-not-for-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install API dependencies
        run: npm install --ignore-scripts
      - name: Prepare isolated PostgreSQL schema
        run: npm run migrate
      - name: Run Dashboard Overview PostgreSQL aggregation contract
        run: node --test test/dashboardAnalyticsPostgres.test.js

  postgres:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install database client
        run: npm install --no-save pg@8.16.3
      - name: Inspect Task 6 staging schema without exposing credentials
        if: github.event_name == 'push' || inputs.auth_role_audit != true
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          node <<'NODE'
          const { Pool } = require('pg');

          function strictTlsConfig(rawUrl) {
            const databaseUrl = new URL(rawUrl);
            if (!['postgres:', 'postgresql:'].includes(databaseUrl.protocol)) throw new Error('INVALID_DATABASE_PROTOCOL');
            return {
              host: databaseUrl.hostname,
              port: Number(databaseUrl.port || 5432),
              user: decodeURIComponent(databaseUrl.username),
              password: decodeURIComponent(databaseUrl.password),
              database: decodeURIComponent(databaseUrl.pathname.replace(/^\//, '')),
              ssl: { rejectUnauthorized: true, servername: databaseUrl.hostname },
            };
          }

          (async () => {
            const pool = new Pool(strictTlsConfig(process.env.STAGING_DATABASE_URL));
            let client;
            try {
              client = await pool.connect();
            } catch {
              console.error('TLS_VERIFICATION_FAILED');
              process.exitCode = 4;
              await pool.end();
              return;
            }
            try {
              const stream = client.connection.stream;
              if (stream.encrypted !== true || stream.authorized !== true) {
                console.error('TLS_VERIFICATION_FAILED');
                process.exitCode = 4;
                return;
              }
              console.log('TLS_VERIFIED: yes');
              const result = await client.query(`
                SELECT
                  current_setting('server_version') AS server_version,
                  EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector') AS vector_installed,
                  EXISTS (SELECT 1 FROM pg_available_extensions WHERE name = 'vector') AS vector_available,
                  has_database_privilege(current_database(), 'CREATE') AS can_create_in_database
              `);
              const row = result.rows[0];
              console.log('POSTGRES_VERSION: ' + row.server_version);
              console.log('PGVECTOR_INSTALLED: ' + (row.vector_installed ? 'yes' : 'no'));
              console.log('PGVECTOR_AVAILABLE: ' + (row.vector_available ? 'yes' : 'no'));
              console.log('DATABASE_CREATE_PRIVILEGE: ' + (row.can_create_in_database ? 'yes' : 'no'));
              if (!row.vector_installed || !row.vector_available) {
                console.log('KBV2_PREFLIGHT: BLOCKED_PGVECTOR_UNAVAILABLE');
                process.exitCode = 2;
                return;
              }

              const expectedTables = [
                'knowledge_source_assistants', 'knowledge_chunks', 'knowledge_candidates',
                'knowledge_candidate_evidence', 'knowledge_gaps', 'knowledge_processing_jobs',
                'knowledge_gap_signals', 'business_profiles', 'business_profile_versions',
                'assistant_knowledge_recommendations', 'assistant_configuration_versions',
                'knowledge_generation_runs', 'business_identities',
                'knowledge_source_business_identities', 'business_identity_source_evidence'
              ];
              const expectedColumns = {
                knowledge_base_documents: ['source_type', 'storage_key', 'processing_status', 'indexing_status', 'extraction_hash', 'extraction_method', 'extracted_at'],
                knowledge_gaps: ['dedupe_key', 'signal_type', 'last_detected_at'],
                business_profiles: ['approved_version_id', 'active_version_id', 'activated_by', 'activated_at', 'business_identity_id'],
                business_profile_versions: ['generation_run_id', 'schema_version', 'activated_by', 'activated_at', 'superseded_by_version_id', 'source_scope', 'identity_resolution_status'],
                assistant_knowledge_recommendations: ['generation_run_id', 'schema_version'],
                assistant_configuration_versions: ['generation_run_id', 'schema_version', 'status', 'approved_at', 'activated_at', 'supersedes_version_id'],
                ai_assistants: ['active_configuration_version_id', 'knowledge_authority_version'],
                conversation_messages: ['authority_assistant_id', 'knowledge_authority_version']
              };
              const expectedIndexes = [
                'knowledge_chunks_embedding_hnsw', 'idx_knowledge_processing_jobs_claim',
                'uq_knowledge_gaps_tenant_dedupe', 'idx_knowledge_gaps_tenant_assistant_review',
                'idx_knowledge_gap_signals_tenant_assistant',
                'idx_assistant_configuration_versions_one_active',
                'idx_knowledge_generation_runs_tenant_created',
                'idx_conversation_messages_provider_authority',
                'idx_conversation_messages_tenant_created',
                'idx_business_identities_tenant_status', 'idx_source_business_identities_identity'
              ];
              const expectedConstraints = [
                'fk_business_profiles_active_version', 'fk_business_profile_versions_superseded_by',
                'fk_assistant_configuration_versions_supersedes',
                'fk_ai_assistants_active_configuration_version',
                'fk_business_profile_versions_generation_run',
                'fk_assistant_recommendations_generation_run',
                'fk_assistant_configurations_generation_run',
                'ck_channel_integrations_type',
                'chk_ai_assistants_knowledge_authority_version',
                'chk_conversation_messages_knowledge_authority_version',
                'chk_conversation_messages_authority_provenance_pair',
                'fk_conversation_messages_authority_assistant',
                'fk_business_profiles_identity', 'chk_business_profile_identity_resolution'
              ];
              const expectedTriggers = [
                'trg_stamp_conversation_message_authority',
                'trg_knowledge_source_assignment_authority',
                'trg_task6_source_authority',
                'trg_legacy_knowledge_authority',
                'trg_active_configuration_authority',
                'trg_active_business_profile_authority'
              ];

              const tables = await client.query(
                `SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name = ANY($1::text[])`,
                [expectedTables]
              );
              const presentTables = new Set(tables.rows.map(({ table_name }) => table_name));
              const missingTables = expectedTables.filter((name) => !presentTables.has(name));

              const missingColumns = [];
              for (const [table, columns] of Object.entries(expectedColumns)) {
                const found = await client.query(
                  `SELECT column_name FROM information_schema.columns WHERE table_schema = 'public' AND table_name = $1 AND column_name = ANY($2::text[])`,
                  [table, columns]
                );
                const present = new Set(found.rows.map(({ column_name }) => column_name));
                for (const column of columns) if (!present.has(column)) missingColumns.push(table + '.' + column);
              }

              const indexes = await client.query(
                `SELECT indexname FROM pg_indexes WHERE schemaname = 'public' AND indexname = ANY($1::text[])`,
                [expectedIndexes]
              );
              const presentIndexes = new Set(indexes.rows.map(({ indexname }) => indexname));
              const missingIndexes = expectedIndexes.filter((name) => !presentIndexes.has(name));

              const constraints = await client.query(
                `SELECT conname FROM pg_constraint WHERE conname = ANY($1::text[])`,
                [expectedConstraints]
              );
              const presentConstraints = new Set(constraints.rows.map(({ conname }) => conname));
              const missingConstraints = expectedConstraints.filter((name) => !presentConstraints.has(name));
              const triggers = await client.query(
                `SELECT tgname FROM pg_trigger WHERE NOT tgisinternal AND tgname = ANY($1::text[])`,
                [expectedTriggers]
              );
              const presentTriggers = new Set(triggers.rows.map(({ tgname }) => tgname));
              const missingTriggers = expectedTriggers.filter((name) => !presentTriggers.has(name));
              const webChatConstraint = await client.query(
                `SELECT pg_get_constraintdef(oid) AS definition FROM pg_constraint WHERE conname = 'ck_channel_integrations_type'`
              );
              const webChatIntegrationAllowed = webChatConstraint.rows.length === 1 && /WEB_CHAT/.test(webChatConstraint.rows[0].definition);

              console.log('TASK6_TABLES: ' + (missingTables.length ? 'missing ' + missingTables.join(',') : 'ok'));
              console.log('TASK6_COLUMNS: ' + (missingColumns.length ? 'missing ' + missingColumns.join(',') : 'ok'));
              console.log('TASK6_INDEXES: ' + (missingIndexes.length ? 'missing ' + missingIndexes.join(',') : 'ok'));
              console.log('TASK6_CONSTRAINTS: ' + (missingConstraints.length ? 'missing ' + missingConstraints.join(',') : 'ok'));
              console.log('TASK6_AUTHORITY_TRIGGERS: ' + (missingTriggers.length ? 'missing ' + missingTriggers.join(',') : 'ok'));
              console.log('SIGNED_WEB_CHAT_INTEGRATION: ' + (webChatIntegrationAllowed ? 'ok' : 'missing'));
              if (missingTables.length || missingColumns.length || missingIndexes.length || missingConstraints.length || missingTriggers.length || !webChatIntegrationAllowed) {
                console.log('KBV2_PREFLIGHT: BLOCKED_SCHEMA_INCOMPLETE');
                process.exitCode = 3;
                return;
              }

              const mappings = await client.query(`
                SELECT
                  ci.tenant_id,
                  ci.assistant_id,
                  aa.name AS assistant_name,
                  array_agg(DISTINCT connected.channel_type ORDER BY connected.channel_type)
                    FILTER (WHERE connected.status = 'active') AS connected_channels
                FROM channel_integrations ci
                JOIN ai_assistants aa
                  ON aa.id = ci.assistant_id AND aa.tenant_id = ci.tenant_id
                JOIN tenant_channels mapped
                  ON mapped.id = ci.channel_id
                  AND mapped.tenant_id = ci.tenant_id
                  AND mapped.assistant_id = ci.assistant_id
                LEFT JOIN tenant_channels connected
                  ON connected.tenant_id = ci.tenant_id
                  AND connected.assistant_id = ci.assistant_id
                WHERE ci.enabled = true
                  AND ci.integration_type IN ('WHATSAPP', 'SAMCHEGUIDE')
                GROUP BY ci.tenant_id, ci.assistant_id, aa.name
                ORDER BY ci.tenant_id, ci.assistant_id
              `);
              for (const mapping of mappings.rows) {
                console.log('CHANNEL_ASSISTANT_MAPPING: ' + JSON.stringify(mapping));
              }
              console.log('CHANNEL_ASSISTANT_MAPPING_COUNT: ' + mappings.rowCount);
              console.log('KBV2_PREFLIGHT: TASK6_SCHEMA_COMPATIBLE');
            } finally {
              client.release();
              await pool.end();
            }
          })().catch(() => {
            console.error('KBV2_PREFLIGHT: DATABASE_CHECK_FAILED');
            process.exitCode = 1;
          });
          NODE

      - name: Verify staging authentication roles
        if: github.event_name == 'workflow_dispatch' && inputs.auth_role_audit == true
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          function strictTlsConfig(rawUrl) {
            const databaseUrl = new URL(rawUrl);
            if (!['postgres:', 'postgresql:'].includes(databaseUrl.protocol)) throw new Error('INVALID_DATABASE_PROTOCOL');
            return {
              host: databaseUrl.hostname,
              port: Number(databaseUrl.port || 5432),
              user: decodeURIComponent(databaseUrl.username),
              password: decodeURIComponent(databaseUrl.password),
              database: decodeURIComponent(databaseUrl.pathname.replace(/^\//, '')),
              ssl: { rejectUnauthorized: true, servername: databaseUrl.hostname },
            };
          }

          (async () => {
            const client = new Client(strictTlsConfig(process.env.STAGING_DATABASE_URL));
            let transactionStarted = false;
            try {
              try {
                await client.connect();
              } catch {
                console.error('TLS_VERIFICATION_FAILED');
                process.exitCode = 4;
                return;
              }
              const stream = client.connection.stream;
              if (stream.encrypted !== true || stream.authorized !== true) {
                console.error('TLS_VERIFICATION_FAILED');
                process.exitCode = 4;
                return;
              }

              await client.query('BEGIN');
              transactionStarted = true;
              await client.query('SET TRANSACTION READ ONLY');
              const owners = await client.query(`
                SELECT email, system_role, status
                FROM users
                WHERE system_role = 'OWNER'
                ORDER BY email;
              `);
              const dashboardAdmin = await client.query(`
                SELECT email, system_role, status
                FROM users
                WHERE email = 'dashboard-e2e-admin-20260822@samche-staging.test';
              `);
              await client.query('ROLLBACK');
              transactionStarted = false;

              for (const row of owners.rows) console.log(JSON.stringify(row));
              for (const row of dashboardAdmin.rows) console.log(JSON.stringify(row));
            } finally {
              if (transactionStarted) await client.query('ROLLBACK').catch(() => {});
              await client.end().catch(() => {});
            }
          })().catch(() => {
            console.error('AUTH_ROLE_AUDIT_FAILED');
            process.exitCode = 1;
          });
          NODE
